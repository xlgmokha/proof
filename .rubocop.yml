plugins:
  - rubocop-rails
  - rubocop-rspec
# For a list of available cops see:
# https://github.com/bbatsov/rubocop/blob/master/config/default.yml
AllCops:
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 4.0
  Exclude:
    - 'bin/**/*'
    - 'config/initializers/*.rb'
    - 'config/routes.rb'
    - 'db/schema.rb'
    - 'db/seeds.rb'
    - 'node_modules/**/*'
    - 'pkg/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'

Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Layout/LineLength:
  Exclude:
    - 'db/migrate/*'
    - 'spec/**/*'

Metrics/MethodLength:
  Enabled: false

Metrics/ParameterLists:
  Exclude:
    - 'spec/documentation.rb'

Metrics/PerceivedComplexity:
  Enabled: false

Naming/RescuedExceptionsVariableName:
  PreferredName: error

Rails/CreateTableWithTimestamps:
  Exclude:
    - 'db/migrate/20180923222720_install_audited.rb'

Rails/SkipsModelValidations:
  Enabled: false

RSpec/DescribeClass:
  Enabled: false

RSpec/ExampleLength:
  Exclude:
    - 'spec/system/**/*'
    - 'spec/documentation.rb'

RSpec/LetSetup:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 2

RSpec/NamedSubject:
  Enabled: false

RSpec/NestedGroups:
  Max: 5

Style/Documentation:
  Enabled: false

Style/GlobalVars:
  Exclude:
    - 'spec/documentation.rb'

Style/RaiseArgs:
  EnforcedStyle: compact

Style/RegexpLiteral:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Style/SymbolArray:
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  Enabled: false

Style/TrailingCommaInArguments:
  Enabled: false

RSpec/MatchArray:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/PendingWithoutReason:
  Enabled: false

# Cops added by newer RuboCop releases; to be addressed separately from the upgrade.
Lint/MissingSuper:
  Enabled: false

Naming/MethodName:
  Enabled: false

Rails/IndexWith:
  Enabled: false

Rails/Pick:
  Enabled: false

Rails/RakeEnvironment:
  Enabled: false

Rails/UniqueValidationWithoutIndex:
  Enabled: false

RSpec/SpecFilePathSuffix:
  Enabled: false

Style/GlobalStdStream:
  Enabled: false

Style/RedundantFetchBlock:
  Enabled: false

Style/RedundantInterpolation:
  Enabled: false

Style/SlicingWithRange:
  Enabled: false

Style/StringConcatenation:
  Enabled: false

Style/YodaCondition:
  Enabled: false

Rails/BulkChangeTable:
  Exclude:
    - 'db/migrate/*'
